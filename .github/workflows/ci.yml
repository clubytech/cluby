name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts — 101 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      # Unit tests only. The fork suite reads live mainnet state and needs an archive endpoint, so
      # it is not something a pull request from a stranger can be asked to run.
      - name: forge test
        run: forge test --no-match-path 'test/fork/*' -vv
        working-directory: contracts

      - name: forge fmt --check
        run: forge fmt --check
        working-directory: contracts
        continue-on-error: true

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cluby/web build
