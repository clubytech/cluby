"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  market(id: String!): market
  markets(where: marketFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): marketPage!
  position(id: String!): position
  positions(where: positionFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): positionPage!
  txEvent(id: String!): txEvent
  txEvents(where: txEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): txEventPage!
  liquidation(id: String!): liquidation
  liquidations(where: liquidationFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): liquidationPage!
  accrual(id: String!): accrual
  accruals(where: accrualFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): accrualPage!
  feedTick(id: String!): feedTick
  feedTicks(where: feedTickFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): feedTickPage!
  stockToken(address: String!): stockToken
  stockTokens(where: stockTokenFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): stockTokenPage!
  snapshot(id: String!): snapshot
  snapshots(where: snapshotFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): snapshotPage!
  _meta: Meta
}

