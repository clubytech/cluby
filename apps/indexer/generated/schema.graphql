type Query {
  market(id: String!): market
  markets(where: marketFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): marketPage!
  vault(id: String!): vault
  vaults(where: vaultFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): vaultPage!
