[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# The deploy scripts read the JSON catalog field by field, which the legacy codegen cannot fit in
# stack slots — they build under [profile.deploy] instead, so day-to-day `forge build`/`forge test`
# stay on the fast pipeline. Run deploys with FOUNDRY_PROFILE=deploy.
# The vault sources and their tests pin solc 0.8.26; they build under [profile.vault].
skip = ["script/**", "test/fork/Vault.fork.t.sol", "test/fork/PreLiquidation.fork.t.sol"]
fs_permissions = [{ access = "read-write", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Fork tests are opt-in: run with `forge test --match-path 'test/fork/*' --fork-url robinhood`
# or via the `fork` profile below.
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 512
depth = 64

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_public = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Blockscout verification (chain id 4663), pass flags on the CLI so scripts don't probe the explorer:
# forge verify-contract <addr> src/X.sol:X --chain-id 4663 --verifier blockscout \
#   --verifier-url https://robinhoodchain.blockscout.com/api/

# The deploy scripts read a JSON catalog field by field, which the legacy codegen cannot fit in
# stack slots. They compile under the IR pipeline; contracts and tests stay on the fast path.
[profile.deploy]
via_ir = true
optimizer_runs = 1000
# Scripts that drive vendored sources pin those sources' compilers; they build under their own
# profiles (vault, preliq). This one is for our 0.8.28 tree.
skip = ["script/DeployVaultFactory*", "script/CreateVault*", "script/CreatePartnerVault*", "script/DeployPreLiquidation*", "script/CreatePreLiquidations*", "test/fork/Vault*", "test/fork/PreLiquidation*"]

# MetaMorpho V1.1 is vendored from morpho-org/metamorpho-v1.1 and pins `pragma solidity 0.8.26`
# exactly, so it cannot build under the 0.8.28 pin the rest of the tree uses. Its own profile lets
# Foundry pick the version each file asks for, and keeps the vendored sources out of the default
# build — they are deployed as audited, not edited.
[profile.vault.lint]
# Vendored, audited code: we do not edit it, so linting it produces noise we must not act on.
lint_on_build = false

[profile.vault]
# Pinned to what the vendored sources demand. Our own 0.8.28 contracts are skipped rather than
# compiled alongside: the two pragmas cannot share a compilation unit, and the vault deploy needs
# nothing from src/ anyway.
solc_version = "0.8.26"
via_ir = true
optimizer_runs = 200
skip = [
  # Everything that is not the MetaMorpho sources or the scripts that drive them. Each vendored
  # dependency pins its own compiler, so the profiles have to fence each other off explicitly.
  "src/**",
  "test/unit/**",
  "test/mocks/**",
  "test/fork/MorphoStack*",
  "test/fork/Leverage*",
  "test/fork/PreLiquidation*",
  "script/CreateMarkets*",
  "script/DeployCore*",
  "script/SeedMarket*",
  "script/SetupForkMarket*",
  "script/TransferOwnership*",
  "script/DeployPreLiquidation*",
  "script/CreatePreLiquidations*",
]
# The vendored sources import OpenZeppelin by relative path, expecting a copy inside their own lib/.
# Remapping it to the one we already have avoids a second 30 MB checkout that would then need
# keeping in step.
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "lib/metamorpho-v1.1/lib/openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

[profile.preliq.lint]
lint_on_build = false

# Morpho's pre-liquidation sources, vendored from morpho-org/pre-liquidation @ a9ef88fe. They pin
# `pragma solidity 0.8.27`, which cannot share a compilation unit with the tree's 0.8.28.
[profile.preliq]
solc_version = "0.8.27"
# Morpho builds these with the IR pipeline; the legacy codegen cannot fit PreLiquidation's locals.
via_ir = true
optimizer_runs = 200
skip = [
  # Everything that is not the pre-liquidation sources or the scripts driving them. Each vendored
  # dependency pins its own compiler, so the profiles fence each other off explicitly.
  "src/**",
  "test/unit/**",
  "test/mocks/**",
  "test/fork/MorphoStack*",
  "test/fork/Leverage*",
  "test/fork/Vault*",
  "script/CreateMarkets*",
  "script/DeployCore*",
  "script/SeedMarket*",
  "script/SetupForkMarket*",
  "script/TransferOwnership*",
  "script/DeployVaultFactory*",
  "script/CreateVault*",
  "script/CreatePartnerVault*",
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
